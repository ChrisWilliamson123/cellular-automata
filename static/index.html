<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cellular Automaton Viewer</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="./styles.css">
</head>

<body class="bg-light text-center">

    <div class="container-fluid vh-100 d-flex flex-column">
        <header class="py-3 mb-2 bg-dark text-white">
            <h3 class="mb-0">Cellular Automaton Viewer</h3>
        </header>

        <div class="row flex-grow-1">
            <!-- Left sidebar -->
            <aside class="col-md-2 bg-white border-end p-3 d-flex flex-column">
                <h5 class="text-start">Automata</h5>
                <ul class="list-group flex-grow-1 mb-3" id="automataList">
                    <li class="list-group-item active">Game of Life</li>
                    <li class="list-group-item">HighLife</li>
                    <li class="list-group-item">Seeds</li>
                </ul>
            </aside>

            <!-- Center: Canvas -->
            <main class="col-md-8 d-flex flex-column align-items-center justify-content-center bg-light">
                <canvas id="ca" width="300" height="300" class="border border-2 shadow-sm rounded"></canvas>
            </main>

            <!-- Right sidebar -->
            <aside class="col-md-2 bg-white border-start p-3 d-flex flex-column justify-content-between">
                <div>
                    <h5>Controls</h5>
                    <div class="d-grid gap-2 mb-3">
                        <button id="toggle" class="btn btn-primary">Pause / Resume</button>
                        <button id="reset" class="btn btn-primary">Reset</button>
                        <select id="rule" class="form-select">
                            <option>Game of Life</option>
                            <option>HighLife</option>
                            <option>Seeds</option>
                        </select>
                    </div>

                    <h6>Framerate</h6>
                    <div class="d-flex align-items-center justify-content-between">
                        <input type="range" min="1" max="120" value="60" class="form-range flex-grow-1 me-2" id="framerateSlider" list="framerateValues">
                        <datalist id="framerateValues">
                            <option value="1">
                            <option value="15">
                            <option value="30">
                            <option value="60">
                            <option value="90">
                            <option value="120">
                        </datalist>
                        <span id="framerateValue" class="fw-bold">60</span><span class="ms-1">FPS</span>
                    </div>
                </div>

                <div class="border-top pt-2 mt-3 text-start small text-muted d-flex justify-content-between">
                    <span id="subtitle"></span>
                    <span id="iterations"></span>
                </div>
            </aside>
        </div>
    </div>

    <!-- Bootstrap JS (optional, for dynamic features) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!--- My JS -->
    <script src="./main.js"></script>
</body>

</html>
