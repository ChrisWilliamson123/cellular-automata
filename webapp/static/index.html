<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cellular Automaton Viewer</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="./styles.css">
</head>

<body class="bg-light text-center">

    <div class="container-fluid vh-100 d-flex flex-column">
        <header class="py-3 mb-2 bg-dark text-white">
            <h3 class="mb-0">Cellular Automaton Viewer</h3>
        </header>

        <div class="row flex-grow-1">
            <!-- Left sidebar -->
            <aside class="col-md-2 bg-white border-end p-3 d-flex flex-column">
                <h5 class="text-start">Automata</h5>
                <ul class="list-group flex-grow-1 mb-3" id="automataList">
                    <li class="list-group-item active">Game of Life</li>
                    <li class="list-group-item">HighLife</li>
                    <li class="list-group-item">Seeds</li>
                </ul>
            </aside>

            <!-- Center: Canvas -->
            <main class="col-md-8 d-flex flex-column align-items-center bg-light">
                <div class="d-flex flex-column">
                    <canvas id="ca" width="300" height="300" class="border border-2 shadow-sm rounded"></canvas>
                    <div class="mt-1 d-flex justify-content-between">
                        <div class="d-flex gap-2">
                            <button id="playPauseBtn" class="btn btn-outline-secondary">
                                <i id="playPauseIcon" class="bi bi-pause-fill"></i>
                            </button>
                            <button id="resetBtn" class="btn btn-outline-secondary">
                                <i id="resetIcon" class="bi bi-arrow-clockwise"></i>
                            </button>
                            <button id="rewindBtn" class="btn btn-outline-secondary">
                                <i id="rewindIcon" class="bi bi-rewind"></i>
                            </button>
                            <div id="speedControls" class="gap-1">
                                <button class="btn btn-outline-secondary" value="0.5">
                                    <span>0.5x</span>
                                </button>
                                <button class="btn btn-secondary" value="1">
                                    <span>1x</span>
                                </button>
                                <button class="btn btn-outline-secondary" value="2">
                                    <span>2x</span>
                                </button>
                                <button class="btn btn-outline-secondary" value="4">
                                    <span>4x</span>
                                </button>
                            </div>
                        </div>
                        <!-- <div>
                            <button id="randomiseNotationBtn" class="btn btn-outline-secondary">
                                <span>Randomise Notation</span>
                            </button>
                        </div> -->
                    </div>
                </div>
            </main>

            <!-- Right sidebar -->
            <aside class="col-md-2 bg-white border-start p-3 d-flex flex-column justify-content-between">
                <div class="d-flex flex-column align-items-stretch gap-2">
                    <h5>Controls</h5>
                    <div id="randomBinaryControlsContainer" class="d-none flex-column gap-2">
                        <button id="randomiseNotationBtn" class="btn btn-primary">
                            <span>Randomise B/S</span>
                        </button>
                        <form id="bsNotationForm" class="d-flex align-items-stretch justify-content-between">
                            <input type="text" id="bsNotationInput" placeholder="B3/S23" />
                            <button type="submit" id="bsNotationSubmitBtn" class="btn btn-primary">
                                <i id="bsNotationSubmitIcon" class="bi bi-play-fill"></i>
                            </button>
                        </form>
                    </div>
                    <div id="coloursContainer" class="d-flex gap-2">
                    </div>
                </div>

                <div class="border-top pt-2 mt-3 text-start small text-muted d-flex justify-content-between">
                    <span id="subtitle"></span>
                    <span id="iterations"></span>
                </div>
            </aside>
        </div>
    </div>

    <!-- Bootstrap JS (optional, for dynamic features) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!--- My JS -->
    <script src="./main.js"></script>
</body>

</html>
